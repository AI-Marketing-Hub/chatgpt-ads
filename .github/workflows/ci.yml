name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install local validation dependency
        run: python -m pip install "jsonschema>=4,<5"
      - name: Run Linux deterministic checks
        if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/knowledge_core.py validate
          python scripts/knowledge_core.py sync-projection --check
          python scripts/validate_pack.py
          python -m unittest discover -s skills/chatgpt-ads/tests -p "test_*.py"
          python acceptance/workflows/verify.py
          python acceptance/measurement/run_offline_cases.py
          python scripts/doctor.py
      - name: Check the documented Windows capability boundary
        if: runner.os == 'Windows'
        run: |
          python -m unittest discover -s tests -p "test_safe_io.py"
          python scripts/doctor.py --json
